name: Release And Deploy

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
          - prod
          - all
      domain:
        required: true
        type: choice
        description: Select the domain
        options:
          - weu-shared
          - itn-printit
      semver:
        required: true
        type: choice
        description: Select the new Semantic Version
        options:
          - major
          - minor
          - patch
          - buildNumber
          - skip
        default: skip
      beta:
        required: false
        type: boolean
        description: deploy beta version on AKS
        default: false

permissions:
  packages: write
  contents: write
  issues: write
  id-token: write
  actions: read


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.get_semver.outputs.semver }}
      environment: ${{ steps.output.outputs.environment }}
    steps:
      - name: Get semver
        id: get_semver
        uses: pagopa/github-actions-template/semver-setup@0018ad6b766a082c35ec88cd9f18de6b54fd59d1 # v1.4.2

      - if: ${{ github.event.inputs.environment == null || github.event.inputs.environment == 'dev' }}
        run: echo "ENVIRNOMENT=dev" >> $GITHUB_ENV

      - if: ${{ github.event.inputs.environment == 'uat' }}
        run: echo "ENVIRNOMENT=uat" >> $GITHUB_ENV

      - if: ${{ github.event.inputs.environment == 'prod' }}
        run: echo "ENVIRNOMENT=prod" >> $GITHUB_ENV

      - if: ${{ github.event.inputs.environment == 'all' }}
        run: echo "ENVIRNOMENT=all" >> $GITHUB_ENV

      - id: output
        name: Set Output
        run: |
          echo "environment=${{env.ENVIRNOMENT}}" >> $GITHUB_OUTPUT


  release:
    name: Create a New Release
    runs-on: ubuntu-latest
    needs: [ setup ]
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Make Release
        id: release
        uses: pagopa/github-actions-template/maven-release@d63ef91b9b1f0021276f0d63dadf42067d0b49f6 # v1.5.2
        with:
          semver: ${{ needs.setup.outputs.semver }}
          github_token: ${{ secrets.BOT_TOKEN_GITHUB }}
          beta: ${{ inputs.beta }}
          skip_ci: ${{ inputs.beta }}

  build-and-push:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [ node, java ]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.type == 'node' && './node' || '.' }}
          file: ${{ matrix.type == 'node' && 'node/Dockerfile' || 'Dockerfile' }}
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}/pagopapdfengine${{ matrix.type == 'java' && 'java' || '' }}:${{ needs.setup-and-release.outputs.version }}
            ${{ secrets.ACR_NAME }}/pagopapdfengine${{ matrix.type == 'java' && 'java' || '' }}:latest

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # Gestisce l'approvazione per uat/prod
    strategy:
      matrix:
        type: [node, java]
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: pagopa-${{ inputs.environment == 'prod' && 'p' || 'd' }}-${{ inputs.domain }}-app-pdf-engine-${{ matrix.type }}${{ inputs.environment == 'prod' && '-ha' || '' }}
          images: ${{ secrets.CONTAINER_REGISTRY }}/pagopapdfengine${{ matrix.type == 'java' && 'java' || '' }}:${{ needs.setup-and-release.outputs.version }}
          slot-name: ${{ inputs.environment != 'dev' && 'staging' || '' }}
          resource-group-name: pagopa-${{ inputs.environment == 'prod' && 'p' || 'd' }}-${{ inputs.domain }}-pdf-engine-rg

      - name: Swap Slots (if not dev)
        if: inputs.environment != 'dev'
        run: |
          az webapp deployment slot swap \
            --name pagopa-${{ inputs.environment == 'prod' && 'p' || 'd' }}-${{ inputs.domain }}-app-pdf-engine-${{ matrix.type }}${{ inputs.environment == 'prod' && '-ha' || '' }} \
            --resource-group pagopa-${{ inputs.environment == 'prod' && 'p' || 'd' }}-${{ inputs.domain }}-pdf-engine-rg \
            --slot staging --target-slot production

  notify:
    needs: [ deploy ]
    runs-on: ubuntu-latest
    name: Notify
    if: always()
    steps:
      - name: Report Status
        if: always()
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
        with:
          status: ${{ needs.deploy_aks.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notify_when: 'failure,skipped'
          notification_title: '{workflow} has {status_message}'
          message_format: '{emoji} <{workflow_url}|{workflow}> {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked to Repo <{repo_url}|{repo}>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
