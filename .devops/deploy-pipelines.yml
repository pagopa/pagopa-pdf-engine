parameters:
  - name: ENV
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - uat
      - prod
  - name: SEMVER
    displayName: "When packing a release, define the version bump to apply. Use only buildNumber or skip for manual deployment"
  - name: DOCKERFILE
    displayName: Dockerfile path
    type: string
  - name: BUILD_CONTEXT
    displayName: Docker build context
    type: string
  - name: IMAGE_NAME
    displayName: Image Name
    type: string
  - name: TYPE
    displayName: Target pdf engine node/java
    type: string
    default: node
    values:
      - node
      - java
  - name: APP_SERVICE_NAME
    displayName: App Service Name Image Name
    type: string
  - name: APP_SERVICE_RESOURCE_GROUP
    displayName: App Service Resource Group
    type: string
  - name: DOMAIN
    displayName: App Service Resource Group
    type: string
    default: weu-shared
    values:
      - weu-shared
      - itn-printit



variables:
  ${{ if eq(parameters['ENV'], 'dev') }}:
    poolImage: 'pagopa-dev-linux'
    AZURE_SUBSCRIPTION: $(DEV_AZURE_SUBSCRIPTION)
    #    RESOURCE_GROUP: $(DEV_WEB_APP_RESOURCE_GROUP_NAME)
    # APP_NAME: $(DEV_WEB_APP_NAME)
    STAGE: "d"
    ${{ if eq(parameters['DOMAIN'], 'weu-shared') }}:
      dockerRegistryServiceConnection: $(DEV_CONTAINER_REGISTRY_SERVICE_CONN)
      dockerNamespace: $(DEV_CONTAINER_NAMESPACE)
    ${{ if eq(parameters['DOMAIN'], 'itn-printit') }}:
      dockerRegistryServiceConnection: $(ITN_DEV_CONTAINER_REGISTRY_SERVICE_CONN)
      dockerNamespace: $(ITN_DEV_CONTAINER_NAMESPACE)
  ${{ if eq(parameters['ENV'], 'uat') }}:
    poolImage: 'pagopa-uat-linux'
    AZURE_SUBSCRIPTION: $(UAT_AZURE_SUBSCRIPTION)
    #    RESOURCE_GROUP: $(UAT_WEB_APP_RESOURCE_GROUP_NAME)
    # APP_NAME: $(UAT_WEB_APP_NAME)
    STAGE: "u"
    ${{ if eq(parameters['DOMAIN'], 'weu-shared') }}:
      dockerRegistryServiceConnection: $(UAT_CONTAINER_REGISTRY_SERVICE_CONN)
      dockerNamespace: $(UAT_CONTAINER_NAMESPACE)
    ${{ if eq(parameters['DOMAIN'], 'itn-printit') }}:
      dockerRegistryServiceConnection: $(ITN_UAT_CONTAINER_REGISTRY_SERVICE_CONN)
      dockerNamespace: $(ITN_UAT_CONTAINER_NAMESPACE)
  ${{ if eq(parameters['ENV'], 'prod') }}:
    poolImage: 'pagopa-prod-linux'
    AZURE_SUBSCRIPTION: $(PROD_AZURE_SUBSCRIPTION)
    #    RESOURCE_GROUP: $(PROD_WEB_APP_RESOURCE_GROUP_NAME)
    # APP_NAME: $(PROD_WEB_APP_NAME)
    STAGE: "p"
    ${{ if eq(parameters['DOMAIN'], 'weu-shared') }}:
      dockerRegistryServiceConnection: $(PROD_CONTAINER_REGISTRY_SERVICE_CONN)
      dockerNamespace: $(PROD_CONTAINER_NAMESPACE)
    ${{ if eq(parameters['DOMAIN'], 'itn-printit') }}:
      dockerRegistryServiceConnection: $(ITN_PROD_CONTAINER_REGISTRY_SERVICE_CONN)
      dockerNamespace: $(ITN_PROD_CONTAINER_NAMESPACE)
  ${{ if eq(variables['Build.SourceBranchName'], 'merge') }}:
    SOURCE_BRANCH: "main" # force to main branch
  ${{ if ne(variables['Build.SourceBranchName'], 'merge') }}:
    SOURCE_BRANCH: ${{ variables['Build.SourceBranchName'] }}

  title: ""
  sha: ""
  tag: ""

  APP_NAME: ${{ parameters.APP_SERVICE_NAME }}
  IMAGE_REPOSITORY: ${{ parameters.IMAGE_NAME }}
  RESOURCE_GROUP: ${{ parameters.APP_SERVICE_RESOURCE_GROUP }}

# Only manual triggers
trigger: none
pr: none

pool:
  name: $(poolImage)

stages:
  # Deploy on Azure
  - stage: deploy
    jobs:
      # - job: deploy-${{ parameters.TYPE }}
      - job: deploy
        steps:

          - script: |
              echo ${{variables['Build.SourceBranchName']}}        
              echo $(SOURCE_BRANCH)

          - checkout: self
            clean: true
            persistCredentials: true
            submodules: true

          - script: |
              git checkout $(SOURCE_BRANCH)
              git pull

          - task: Docker@2
            displayName: Build and push image to container registry
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(IMAGE_REPOSITORY)'
              Dockerfile: '${{ parameters.DOCKERFILE }}'
              buildContext: '${{ parameters.BUILD_CONTEXT }}'
              command: 'buildAndPush'
              tags: |
                $(Build.BuildId)
                latest

          - task: AzureCLI@2
            displayName: Configure manual-only staging routing
            condition: and(succeeded(), in('${{ parameters.ENV }}', 'prod', 'uat'))
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp deployment slot auto-swap \
                  --name "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --slot staging \
                  --disable \
                  --output none
                az webapp traffic-routing set \
                  --name "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --distribution staging=0 \
                  --output none
            env:
              APP_NAME: $(APP_NAME)
              RESOURCE_GROUP: $(RESOURCE_GROUP)

          - task: AzureRMWebAppDeployment@4
            displayName: Azure App Service Deploy DEV
            condition: and(succeeded(), eq('${{ parameters.ENV }}', 'dev'))
            inputs:
              appType: webAppContainer
              ConnectedServiceName: '$(AZURE_SUBSCRIPTION)'
              WebAppName: '$(APP_NAME)'
              DockerNamespace: '$(dockerNamespace)'
              DockerRepository: '$(IMAGE_REPOSITORY)'
              DockerImageTag: '$(Build.BuildId)'
          - task: AzureRMWebAppDeployment@4
            displayName: Deploy ${{ parameters.ENV }} to staging
            condition: and(succeeded(), in('${{ parameters.ENV }}', 'prod', 'uat'))
            inputs:
              appType: webAppContainer
              ConnectedServiceName: '$(AZURE_SUBSCRIPTION)'
              WebAppName: '$(APP_NAME)'
              DockerNamespace: '$(dockerNamespace)'
              DockerRepository: '$(IMAGE_REPOSITORY)'
              DockerImageTag: '$(Build.BuildId)'
              deployToSlotOrASE: true
              slotName: staging
              resourceGroupName: $(RESOURCE_GROUP)
          - script: |
              echo "##vso[task.setvariable variable=version;isOutput=true]$(pomversion.next)"
            name: dockerTag
  # Promote staging only after a successful deployment and manual approval.
  - stage: deployApproval_PROD_UAT
    displayName: Approve and promote ${{ parameters.ENV }}
    condition: and(succeeded(), in('${{ parameters.ENV }}', 'prod', 'uat'))
    dependsOn: deploy
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: waitForApproval
        displayName: waiting for approval
        pool: server
        timeoutInMinutes: 4320 # 3 days
        steps:
          - task: ManualValidation@0
            displayName: Manual Approval
            timeoutInMinutes: 2880 # 2 days, less than the server job timeout
            inputs:
              notifyUsers: ''
              instructions: |
                Validate build $(Build.BuildId) of $(APP_NAME) in the staging slot.
                Use the production App Service URL with header Cookie: x-ms-routing-name=staging.
                Ensure any gateway forwards this cookie and does not serve cached responses.
                Approve to swap staging into production; reject to leave production unchanged.
              onTimeout: "reject"

      - job: completeProdDeploy
        condition: and(succeeded(), eq(dependencies.waitForApproval.result, 'Succeeded'))
        displayName: complete ${{ parameters.ENV }} deploy
        dependsOn: waitForApproval
        steps:
          # deploy swap
          - task: AzureAppServiceManage@0
            displayName: Swapping App Service Deploy
            inputs:
              Action: 'Swap Slots'
              ConnectedServiceName: $(AZURE_SUBSCRIPTION)
              WebAppName: '$(APP_NAME)'
              ResourceGroupName: $(RESOURCE_GROUP)
              SourceSlot: staging
              SwapWithProduction: true
              Slot: production
